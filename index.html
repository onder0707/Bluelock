<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBA - Eğitim Bilişim Ağı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Üst Bar (Navbar) -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-lock-open"></i>
            <span>BLUELOCK</span>
        </div>
        <div class="url-bar">
            <input type="text" id="customUrl" placeholder="https://google.com veya bir site adresi">
            <button onclick="openCustomUrl()"><i class="fa-solid fa-arrow-right"></i> GIT</button>
        </div>
        <div class="nav-controls">
            <button class="panic-btn" onclick="panic()"><i class="fa-solid fa-triangle-exclamation"></i> PANIC</button>
        </div>
    </header>

    <div class="container">
        <!-- Sol Menü (Kategoriler) -->
        <aside class="sidebar">
            <button class="cat-btn active" onclick="filterCategory('all')"><i class="fa-solid fa-border-all"></i> Tüm Oyunlar</button>
            <button class="cat-btn" onclick="filterCategory('unblocker')"><i class="fa-solid fa-globe"></i> Unblocker</button>
            <button class="cat-btn" onclick="filterCategory('pc')"><i class="fa-solid fa-desktop"></i> PC & Konsol</button>
            <button class="cat-btn" onclick="filterCategory('action')"><i class="fa-solid fa-hand-fist"></i> Aksiyon & Dövüş</button>
            <button class="cat-btn" onclick="filterCategory('racing')"><i class="fa-solid fa-gauge-high"></i> Hız & Yarış</button>
            <button class="cat-btn" onclick="filterCategory('twoplayer')"><i class="fa-solid fa-users"></i> 2 Kişilik</button>
            <button class="cat-btn" onclick="filterCategory('sports')"><i class="fa-solid fa-football"></i> Spor</button>
            <button class="cat-btn" onclick="filterCategory('strategy')"><i class="fa-solid fa-chess"></i> Strateji</button>
            <button class="cat-btn" onclick="filterCategory('puzzle')"><i class="fa-solid fa-puzzle-piece"></i> Bulmaca & Zeka</button>
            <button class="cat-btn" onclick="filterCategory('retro')"><i class="fa-solid fa-gamepad"></i> Retro & Arcade</button>
        </aside>

        <!-- Ana İçerik Alanı -->
        <main class="content">
            <h2 id="sectionTitle"><i class="fa-solid fa-gamepad"></i> OYUN KÜTÜPHANESİ</h2>
            
            <div class="games-grid" id="gamesGrid">
                <!-- Oyunlar JavaScript ile dinamik olarak yüklenecektir -->
            </div>
        </main>
    </div>

    <!-- Modal (Oyun / Unblocker Penceresi) -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Oyun / Web</span>
                <div>
                    <button onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i> Tam Ekran</button>
                    <button class="close-btn" onclick="closeGame()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <iframe id="gameIframe" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script src="games.js"></script>
</body>
</html>
