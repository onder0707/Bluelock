<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">Google Docs</title>
    <link id="tab-icon" rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Panic / Hoca Geldi Ekranı -->
    <div id="panic-screen" class="panic-hidden">
        <iframe src="https://www.wikipedia.org" style="width:100vw; height:100vh; border:none;"></iframe>
    </div>

    <!-- Üst Navbar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-lock-open"></i> BLUE<span>LOCK</span>
        </div>

        <div class="top-search">
            <i class="fa-solid fa-globe search-icon"></i>
            <input type="text" id="proxyUrl" placeholder="https://google.com veya bir site adresi...">
            <button onclick="launchProxy()"><i class="fa-solid fa-arrow-right"></i> GİT</button>
        </div>

        <div class="nav-controls">
            <button onclick="toggleCloak()" class="icon-btn" title="Kılıf Modu (Docs)"><i class="fa-solid fa-user-ninja"></i></button>
            <button onclick="triggerPanic()" class="panic-btn" title="Hoca Geldi! (ESC)"><i class="fa-solid fa-triangle-exclamation"></i> PANIC</button>
        </div>
    </nav>

    <!-- Ana Alan -->
    <div class="main-wrapper">
        <!-- Sol Menü -->
        <aside class="sidebar">
            <a href="#" class="nav-item active" onclick="filterCategory('all')"><i class="fa-solid fa-fire"></i> Tüm Oyunlar</a>
            <a href="#" class="nav-item" onclick="filterCategory('pc')"><i class="fa-solid fa-desktop"></i> PC & Konsol</a>
            <a href="#" class="nav-item" onclick="filterCategory('action')"><i class="fa-solid fa-crosshairs"></i> Aksiyon & Dövüş</a>
            <a href="#" class="nav-item" onclick="filterCategory('speed')"><i class="fa-solid fa-gauge-high"></i> Hız & Yarış</a>
            <a href="#" class="nav-item" onclick="filterCategory('multi')"><i class="fa-solid fa-users"></i> 2 Kişilik</a>
        </aside>

        <!-- İçerik Alanı -->
        <main class="content-area">
            <div class="hero-proxy-card">
                <h2><i class="fa-solid fa-shield-halved"></i> UNBLOCKED WEB SEARCH</h2>
                <p>İstediğiniz engelsiz web sitesine erişin:</p>
                <div class="hero-search-box">
                    <input type="text" id="heroProxyUrl" placeholder="https://wikipedia.org">
                    <button onclick="launchHeroProxy()">Erişim Sağla</button>
                </div>
            </div>

            <div class="section-header">
                <h2 id="category-title"><i class="fa-solid fa-gamepad"></i> OYUN KÜTÜPHANESİ</h2>
            </div>

            <div class="games-grid" id="gamesContainer">
                <!-- Oyunlar JavaScript ile dolacak -->
            </div>
        </main>
    </div>

    <!-- Oyun Açma Penceresi (Modal) -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalGameTitle">Oyun Yükleniyor...</span>
                <div class="modal-actions">
                    <button onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i> Tam Ekran</button>
                    <button onclick="closeGameModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <iframe id="gameFrame" class="modal-iframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="games.js"></script>
</body>
</html>
